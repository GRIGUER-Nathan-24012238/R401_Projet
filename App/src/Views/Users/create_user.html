<div class="form-container">
    <h1>Inscrire un nouvel abonné</h1>
    <form action="/utilisateurs/nouveau" method="POST">
        <div class="form-group">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" name="nom" required placeholder="Ex: Jean Dupont">
        </div>

        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" name="email" required placeholder="Ex: jean.dupont@email.com">
        </div>

        <div class="form-group">
            <label for="adresse">Adresse Postale</label>
            <textarea id="adresse" name="adresse" required placeholder="Ex: 123 Rue de la Liberté, 75000 Paris"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Enregistrer l'abonné</button>
            <a href="/utilisateurs" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>

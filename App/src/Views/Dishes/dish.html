<article class="single-dish">
    <h1>{{NOM}}</h1>
    <p class="description">{{DESCRIPTION}}</p>
    <p class="price"><strong>Prix :</strong> {{PRIX}} €</p>
    <div class="actions">
        <a href="/plats" class="back-link">← Retour à la carte</a>
        <a href="/plats/{{ID}}/modifier" class="back-link btn-edit">✎ Modifier ce plat</a>
        <a href="/plats/{{ID}}/supprimer" class="back-link btn-delete">🗑 Supprimer ce plat</a>
    </div>
</article>

<div class="form-container">
    <h1 class="text-danger">Confirmer la suppression</h1>
    <p>Êtes-vous sûr de vouloir supprimer définitivement le plat suivant ?</p>
    
    <div class="dish-preview">
        <h2>{{NOM}}</h2>
        <p>{{DESCRIPTION}}</p>
        <p><strong>Prix :</strong> {{PRIX}} €</p>
    </div>

    <form action="/plats/{{ID}}/supprimer" method="POST">
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Oui, supprimer définitivement</button>
            <a href="/plats/{{ID}}" class="btn btn-secondary">Non, annuler et revenir</a>
        </div>
    </form>
</div>

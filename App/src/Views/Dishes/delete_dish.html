<div class="form-container">
    <h1 style="color: #dc3545;">Confirmer la suppression</h1>
    <p>Êtes-vous sûr de vouloir supprimer définitivement le plat suivant ?</p>
    
    <div class="dish-preview" style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0;">
        <h2>{{NOM}}</h2>
        <p>{{DESCRIPTION}}</p>
        <p><strong>Prix :</strong> {{PRIX}}</p>
    </div>

    <form action="/plats/{{ID}}/supprimer" method="POST">
        <div class="form-actions">
            <button type="submit" class="btn btn-danger" style="background-color: #dc3545; color: white;">Oui, supprimer définitivement</button>
            <a href="/plats/{{ID}}" class="btn btn-secondary">Non, annuler et revenir</a>
        </div>
    </form>
</div>
